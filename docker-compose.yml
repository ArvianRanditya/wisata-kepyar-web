services:
  app:
    image: serversideup/php:8.4-fpm-nginx
    container_name: desa-kepyar
    restart: unless-stopped
    ports:
      - "8000:8080"
      - "80:8080"
    environment:
      PUID: 501
      PGID: 20
      PHP_OPCACHE_ENABLE: "0"
      SHOW_WELCOME_MESSAGE: "false"
    volumes:
      - .:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

